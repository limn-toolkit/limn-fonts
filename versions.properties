# The version each module's NEXT release carries — the single place a version is written.
#
# Two readers, kept honest by being two readers of one file: build.gradle.kts turns each entry
# into the module's default (-SNAPSHOT) version, and the tag-releases workflow turns each entry
# into a tag on every push to main, creating and publishing the ones that do not exist yet.
# Releasing is therefore: bump the entry (with its pin, if the pin moved), commit, push. Nobody
# types a tag name, nobody pushes a tag, and nobody remembers a scheme.
#
# The scheme itself: the first two components mirror the upstream release the pin points at
# (Noto CJK Sans2.004 → 2.004.x), and the third is this repository's own, so repackaging an
# unchanged upstream has a number to spend. Modules that aggregate mixed or unversionable
# upstream builds (noto-scripts, roboto) version themselves plainly from 1.0.0.
# The .1s supersede first releases whose Gradle module metadata declared "requires Java 21" on
# jars that carry no bytecode (the minimum-JVM attribute followed the toolchain); the bytes of
# every face are unchanged. Central keeps what it accepts, so the fix is a number, not an edit.
# The .2s add a module name to each jar's manifest (limn.fonts.roboto and so on); the faces are
# again unchanged.
noto-cjk=2.004.2
noto-emoji=2.051.2
noto-scripts=1.0.2
roboto=1.0.2
