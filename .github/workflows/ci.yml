# The gate for a push and a PR: the committed faces match their pins, and every module still
# assembles the jars a release would ship. Cheap on purpose — nothing here compiles.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Gradle check and assemble
        run: ./gradlew check assemble
