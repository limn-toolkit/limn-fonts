# The gate for a push and a PR: the committed faces match their pins, and every module still
# assembles the jars a release would ship. Cheap on purpose — nothing here compiles.
name: ci

# Only when something this workflow actually tests can have changed: a face, its pin, the
# packaging. A push that touches the README, RELEASING or the release workflows runs nothing.
on:
  push:
    branches: [main]
    paths:
      - "limn-fonts-*/**"
      - "scripts/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "versions.properties"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "limn-fonts-*/**"
      - "scripts/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "versions.properties"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Gradle check and assemble
        run: ./gradlew check assemble

      # What a release would publish, checked for the mistake the first four releases shipped:
      # module metadata whose minimum-JVM attribute followed the build's toolchain (21) onto
      # jars that carry no bytecode, refusing every consumer building for an older Java at
      # resolution time. The honest answer for a jar of fonts is 8, and this fails if any
      # variant of any module says otherwise.
      - name: The metadata must not demand a JVM the jars do not need
        run: |
          ./gradlew publishAllPublicationsToBuildDirRepository
          BAD="$(grep -rho '"org.gradle.jvm.version": [0-9]*' build/repo --include="*.module" \
                   | sort -u | grep -v ': 8$' || true)"
          if [ -n "$BAD" ]; then
            echo "::error::a published variant declares a minimum JVM other than 8: $BAD"
            exit 1
          fi
          echo "every variant declares JVM 8"
